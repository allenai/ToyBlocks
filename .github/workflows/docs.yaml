name: docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  UV_FROZEN: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build Sphinx Documentation
        run: |
          uv venv --python 3.13
          source .venv/bin/activate
          uv pip install -e .[docs]
          sphinx-build ./docs/source ./docs/build/docs


      - name: Add root redirect
        run: |
          cat > docs/build/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8"><title>ToyBlocks docs</title>
          <meta http-equiv="refresh" content="0; url=docs/">
          <link rel="canonical" href="https://allenai.github.io/ToyBlocks/docs/">
          </head><body><a href="docs/">ToyBlocks documentation</a></body></html>
          HTML

      - name: Remove Sphinx build artifacts
        run: find docs/build -type d -name .doctrees -exec rm -rf {} +

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Pages is configured to serve this branch (Settings > Pages: docs, /).
          # Publishing to gh-pages built the site into a branch nothing serves, so every
          # docs change needed a manual build-and-push to `docs` to go live.
          publish_branch: docs
          publish_dir: ./docs/build/
          keep_files: true

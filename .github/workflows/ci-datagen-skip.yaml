name: Skip CI/CD checks (no core changes)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'src/**'
      - 'curobo'
      - 'curobo/**'
      - 'molmo2'
      - 'molmo2/**'
      - 'maniflow-tb'
      - 'maniflow-tb/**'
      - 'tests/tamp/**'
      - 'tests/replay/**'
      - 'tests/eval/**'
      - 'tests/env_randomization/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'asset_manifest.json'
      - '.github/workflows/ci-datagen.yaml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'src/**'
      - 'curobo'
      - 'curobo/**'
      - 'molmo2'
      - 'molmo2/**'
      - 'maniflow-tb'
      - 'maniflow-tb/**'
      - 'tests/tamp/**'
      - 'tests/replay/**'
      - 'tests/eval/**'
      - 'tests/env_randomization/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'asset_manifest.json'
      - '.github/workflows/ci-datagen.yaml'
  workflow_dispatch:

jobs:
  ci-datagen-test:
    runs-on: [ubuntu-latest]

    steps:
      - run: echo "Nothing to do here, no changes made to core codebase"

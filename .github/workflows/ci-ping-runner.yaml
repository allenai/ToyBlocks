name: Ping self-hosted runner

on:
  workflow_dispatch:

jobs:
  ci-ping-runner:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Clean workspace completely
        run: rm -rf ${{ github.workspace }} && mkdir -p ${{ github.workspace }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
          clean: true

      - name: Debug - Show file info
        run: |
          echo "=== Git status ==="
          git status

      - name: Configure Git credentials for private repos
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Run healthcheck
        run: |
          eval "$(ssh-agent -s)" && ssh-add ~/.ssh/id_ed25519
          ./tests/healthcheck/ping_runner.sh

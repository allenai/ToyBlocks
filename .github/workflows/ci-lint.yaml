name: Formatting | Linting | Typings checks

on:
  push:
    branches:
      main
  pull_request:
    branches:
      main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-format-lint-types-checks:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Clean workspace completely
        run: rm -rf ${{ github.workspace }} && mkdir -p ${{ github.workspace }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
          clean: true
          fetch-depth: 2

      - name: Debug - Show file info
        run: |
          echo "=== Git status ==="
          git status
          echo "From(sha): $(git rev-parse HEAD~1)"
          echo "To(sha): $(git rev-parse HEAD)"

      - name: Configure Git credentials for private repos
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup minimal dev environment
        run: |
          eval "$(ssh-agent -s)" && ssh-add ~/.ssh/id_ed25519
          git submodule update --init curobo maniflow-tb molmo2
          uv venv --python 3.11
          source .venv/bin/activate
          uv pip install "setuptools<81" wheel packaging
          uv pip install -e .[dev,isaac,torch-cu128,maniflow]
          uv pip install -e .[tamp]

      - name: Source virtual environment
        run: |
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Run pre-commit checks (PUSH)
        if: ${{ github.event_name == 'push' }}
        run: |
          pre-commit install
          pre-commit run --from-ref $(git rev-parse HEAD~1) --to-ref $(git rev-parse HEAD)

      - name: Run pre-commit checks (PULL-REQUEST)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_FROM: ${{ github.event.pull_request.base.sha }}
          GH_TO: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "From(sha): $GH_FROM"
          echo "To(sha): $GH_TO"
          pre-commit install
          pre-commit run --from-ref $GH_FROM --to-ref $GH_TO

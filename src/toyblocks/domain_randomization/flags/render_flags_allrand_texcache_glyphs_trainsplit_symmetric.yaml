# dr_schema 3. Renamed from the v2 original, same render:
#   scene_lights.sun    -> scene_lights.global_distant   (ONE shared DistantLight per wave)
#   scenarios.mix[].sun -> scenarios.mix[].local_lights  (gates the PER-ENV lights only)
# Verified: canonicalize_flags() maps this back to a dict identical to the v2 file.
carb_settings:
  /persistent/rtx/modes/rt/enabled: true
  /persistent/rtx/modes/rt2/enabled: true
  /persistent/rtx/rendermode: RealTimePathTracing
  /rtx/rendermode: RealTimePathTracing
hide_objects:
- backdrop
env_spacing: 500
skybox:
  set: polyhaven/rooms
  texture_format: latlong
  rotation_deg:
  - 0
  - 360
  intensity:
  - 500
  - 1000
  visible_background: false
  seed: 0
exposure:
  auto: false
  seed: 7
scene_lights:
  fill_intensity: 0
  fill_auto_ratio: 0.35
  local_lights:
    link_per_env: true
    seed: 5
    count: 1
    lights:
    - type: distant
      intensity:
      - 300
      - 700
      color:
        temperature:
        - 4300
        - 6700
      angle:
      - 0.1
      - 0.3
      elevation:
      - 28
      - 58
      azimuth:
      - 0
      - 360
env_sphere:
  exhaust_before_repeat: true
  sets:
  - set: polyhaven/all
  - set: indoor-2018/all
  shuffle: true
  seed: 7
  material: usdpreview
  emissive: true
  emissive_normalize: true
  emissive_intensity:
  - 0.15
  - 0.28
  emissive_clamp:
  - 0.05
  - 100.0
  cast_shadows: false
  backdrop_only: true
  radius: 200
  far_clip: 800
  rotation_deg: 0
scenarios:
  seed: 123
  mix:
  - name: open_hybrid
    prob: 0.4
    skybox_intensity:
    - 500
    - 1100
    skybox_intensity_dist: log
    iso:
    - 90
    - 145
    fill_intensity: auto
    local_lights: false
  - name: sun_shadow
    prob: 0.6
    skybox_intensity:
    - 150
    - 400
    skybox_intensity_dist: log
    iso:
    - 70
    - 110
    fill_intensity: 0
    local_lights: true
materials:
  table:
    object: workspace_table
    seed: 11
randomize:
  position_offset_cm:
  - 3
  - 3
  - 3
  pitch_deg: 5
  yaw_deg: 5
  roll_deg: 2
  vertical_fov_deg: 3
  seed: 0
  cameras:
    gripper_camera:
      position_offset_cm:
      - 0.5
      - 0.5
      - 0.5
      pitch_deg: 1
      yaw_deg: 1
      roll_deg: 1
      vertical_fov_deg: 0.5
dr_schema: 3

# RAM HDRI cache. Production allrand flags, unchanged above; this only rewrites the asset PATH
# handed to USD to a tmpfs copy so the renderer's per-wave re-read hits memory instead of weka.
# Verified pixel-safe: depth video is bit-identical cache-on vs cache-off, RGB differs at 42.8 dB
# (the DLSS run-to-run noise floor is ~27 dB, so the cache changes nothing real).
#
# max_gb 20: sized for a 32 GiB /dev/shm shared by up to three Isaac processes on one GPU. 4 GiB leaves headroom; the cache is cross-process, so all
# three procs on a node share the same entries rather than each holding a copy.
#   preload: auto -> plan from THIS worker's own leased episodes, never a slice fixed in yaml.
texture_cache:
  enabled: true
  dir: /dev/shm/toyblocks_texture_cache
  preload: auto
  max_gb: 20
  verbose: true

# TRAIN glyph split, symmetry-preserving. Identical to render_flags_allrand_texcache_glyphs_train_colors.yaml
# except for the two keys below, which fix two problems in the renders made with it:
#   * its glyph pool (20 letters + 1,3,4,5,6,7,8,9) and palette (red/green/blue/yellow/purple/orange) did
#     not match the task generator's train split (scripts/task_gen/stack_three.py --train): digit 4 and
#     yellow/purple are VAL holdouts there, 6-9 and orange never occur, and white was missing;
#   * any glyph could become any other, so a symmetric letter whose goal is an (or ...) over several
#     orientations (S: o2/o4/o10/o12) could turn into a glyph that reads only at o2, leaving goals that
#     accept an unreadable block and readable / flip-unreadable starts that no longer are.
#
# Glyphs: the train split's 20 letters (A-Z minus A,B,I,O,R,T) and digits 1,3,5. Every authored glyph
# may only become a glyph of its own symmetry class, the classes stack_three.py builds goals from
# (UPSIDE_DOWN_SYMMETRIC_LETTERS = IHNOSZX, CASE_SYMMETRIC_LETTERS = COPSUVWXZ), so the goal's accepted
# orientations and the start's readability carry over unchanged:
#   both (OSXZ)          o2 o4 o10 o12   S X Z
#   upside-down only     o2 o10          H N
#   lower-case only      o2 o4           C P U V W
#   neither              o2              D E F G J K L M Q Y 1 3 5   (digits behave like these letters)
# Characters outside the train split have no entry and keep their glyph.
randomize_task_letters:
  # the interpreter reads the per-character sets from .glyphs (a bare mapping means all 36 glyphs)
  glyphs:
    S: [S, X, Z]
    X: [S, X, Z]
    Z: [S, X, Z]
    H: [H, N]
    N: [H, N]
    C: [C, P, U, V, W]
    P: [C, P, U, V, W]
    U: [C, P, U, V, W]
    V: [C, P, U, V, W]
    W: [C, P, U, V, W]
    D: &plain [D, E, F, G, J, K, L, M, Q, Y, 1, 3, 5]
    E: *plain
    F: *plain
    G: *plain
    J: *plain
    K: *plain
    L: *plain
    M: *plain
    Q: *plain
    Y: *plain
    "1": *plain
    "3": *plain
    "5": *plain

# ...plus per-env CUBOID colour randomization over the train split's colours. HSV = the authored
# codegen._NAMED_COLORS values (white = rgb 1,1,1), so a recoloured block matches an authored one.
randomize_block_colors:
  colors:
    - {name: red,   hsv: [0.0,                1.0, 1.0]}
    - {name: green, hsv: [0.3333333333333333, 1.0, 1.0]}
    - {name: blue,  hsv: [0.6666666666666666, 1.0, 1.0]}
    - {name: white, hsv: [0.0,                0.0, 1.0]}

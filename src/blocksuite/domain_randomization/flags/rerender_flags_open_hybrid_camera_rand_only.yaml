# Variant of ..._full_backdrop with a DARKER, SHARPER-SHADOW sun_shadow bucket, weighted higher.
# Same normalized backdrop (every skybox visible) + neutral rooms GI. Changes vs full_backdrop:
#   * sun_shadow probability 0.2 -> 0.6 (majority) so more hard-shadow frames appear.
#   * sun_shadow is LESS BRIGHT: lower GI (skybox_intensity) + lower ISO + NO fill -> the shadowed
#     side stays dark, giving strong CONTRAST against the sun-lit side.
#   * sharper sun: local_lights angle 0.2-0.7 -> 0.1-0.3 deg (smaller angular size = crisper penumbra).
#   * open_hybrid (soft/bright, no sun) unchanged, weight 0.8 -> 0.4.
# Backdrop still emissive_normalize (target/median-lum) so it's visible even in the darker bucket.
carb_settings:
  "/persistent/rtx/modes/rt/enabled": true
  "/persistent/rtx/modes/rt2/enabled": true
  "/persistent/rtx/rendermode": RealTimePathTracing
  "/rtx/rendermode": RealTimePathTracing
#hide_objects: ["backdrop"]


exposure:
  auto: false
  seed: 7


# Trimmed ManiFlow checkpoint config.yaml: the 9-dim state (7 arm + 1 gripper +
# 1 pd_mode), RGB-only.
#
# See config_state8.yaml for why this mirrors a real config's key set and why
# nothing hvla's _MANIFLOW_MM_DEFAULTS would supply appears in it.
#
# The three checked-in fixtures differ on more than the state width, so that
# together they cover both branches of everything derive_model_input_spec reads:
#   * pointmaps: state8 declares them with datasets.include_ptmap false (the
#     reconciliation path), state9 has framework.use_ptmap false and declares
#     none (an RGB-only run, so no ptmap_backbone / ptmap_encoder_type either),
#     state19 keeps them.
#   * target_heatmap conditioning: absent in state8, present here and in state19.
#   * language_mode: action_goal here (the LL reads goal pixels in the text),
#     action_only in the other two.
#   * action_mode: abs here and in state8, rel in state19.
datasets:
  vla_data:
    action_mode: abs
    data_mix: ci_state9
    dataset_py: franka_multimodal
    front_cam_key: observation.images.camera:front_camera
    gripper_cam_key: observation.images.camera:gripper_camera
    per_device_batch_size: 128
    use_depth: false
    use_ft: false
    val_ratio: 0.01
framework:
  encoder_type: spatial
  heatmap_encoder_type: shared_rgb
  horizon: 50
  lang_injection_mode: token
  language_conditioned: true
  language_mode: action_goal
  n_action_steps: 25
  n_emb: 768
  n_head: 8
  n_layer: 12
  n_obs_steps: 1
  name: ManiFlowMultiModal
  num_inference_steps: 12
  obs_as_global_cond: true
  propr_mask_prob: 0.0
  qk_norm: true
  qkv_bias: true
  rgb_backbone: vit_base_patch16_clip_224.openai
  shape_meta:
    obs:
      agent_pos:
        shape: [9]
      front_rgb:
        shape: [3, 224, 224]
      gripper_rgb:
        shape: [3, 224, 224]
  state_injection_mode: timestep_concat
  target_injection_mode: cross_attention
  target_sigma: 0.8
  use_ptmap: false
  use_rgb: true
run_id: ci_state9_50_25_abs_token_shared_rgb
seed: 42
trainer:
  learning_rate:
    base: 0.0001
  lr_scheduler_type: cosine
  max_train_steps: 200000
  save_format: safetensors
